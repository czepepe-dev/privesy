<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Přívěs | Přívěsy z Nizozemska</title><link rel="icon" href="/favicon-96x96.png"><link rel="stylesheet" href="assets/css/style-day.css"><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><style>
.product-page{max-width:1100px;margin:40px auto;padding:20px;text-align:center}.product-container{display:flex;gap:40px;flex-wrap:wrap;justify-content:center;align-items:flex-start}.left-col{max-width:450px;width:100%}.product-image{width:100%;border-radius:10px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.1)}.product-image img{width:100%;display:block;cursor:zoom-in}.product-gallery{margin-top:15px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.product-gallery img{width:100%;height:80px;object-fit:cover;border-radius:5px;cursor:pointer}.product-info{flex:1;min-width:300px;max-width:500px;text-align:left}.product-price{font-size:30px;font-weight:700;margin:15px 0;color:#d62828}.product-description{margin-bottom:30px;line-height:1.6}.produkt-buttons{display:flex;gap:15px;margin-top:20px}.produkt-btn,.produkt-info-btn{flex:1;font-size:18px;border:none;cursor:pointer;border-radius:6px}.categorias{margin-top:60px;border-top:1px solid #eee;padding-top:30px;text-align:center}#lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);display:none;justify-content:center;align-items:center;z-index:10000;cursor:zoom-out}#lightbox img{max-width:90%;max-height:90%;border-radius:5px}.close-lightbox{position:absolute;top:20px;right:30px;color:white;font-size:50px;cursor:pointer}@media(max-width:768px){.product-info{text-align:center}.produkt-buttons{flex-direction:row}}
</style></head><body>
<header class="topbar"><div class="logo"><a href="index.html"><img src="logo.png" alt="Přívěsy z Nizozemska" style="height:90px;"></a></div><nav class="menu"><a href="privesy-na-kone.html">Přívěsy na koně</a><a href="nakladni-privesy.html">Nákladní přívěsy</a><a href="ostatni.html">Ostatní</a><a href="contacto.html">Kontakt</a></nav></header>
<main class="product-page"><div class="product-container"><div class="left-col"><div class="product-image"><img id="p-img" src="" alt="" onclick="openLightbox(this.src)"></div><div id="galerie" class="product-gallery"></div></div><div class="product-info"><h1 id="p-nazev" class="produkt-nazev" style="font-size:28px;margin:0;">Načítám...</h1><div class="product-price" id="p-cena"></div><div id="p-popis" class="product-description"></div><div class="produkt-buttons"><button class="produkt-btn" onclick="window.location.href='contacto.html'">KONTAKT</button><button class="produkt-info-btn" onclick="history.back()">ZPĚT</button></div></div></div><section class="categorias"><h2>Kategorie</h2><div class="grid"><a class="card" href="privesy-na-kone.html">Přívěsy na koně</a><a class="card" href="nakladni-privesy.html">Nákladní přívěsy</a><a class="card" href="ostatni.html">Ostatní</a></div></section></main>
<div id="lightbox" onclick="closeLightbox()"><span class="close-lightbox">&times;</span><img id="lightbox-img" src="" alt=""></div>
<script>const params=new URLSearchParams(location.search),slug=params.get('slug');function openLightbox(src){const lb=document.getElementById('lightbox');document.getElementById('lightbox-img').src=src;lb.style.display='flex'}function closeLightbox(){document.getElementById('lightbox').style.display='none'}async function nactiDetail(){if(!slug)return;try{const r=await fetch('/data/productos/'+slug+'.json?t='+Date.now());const d=await r.json();document.getElementById('p-img').src=d.imagen;document.getElementById('p-img').alt=d.nombre;document.getElementById('p-nazev').textContent=d.nombre;document.getElementById('p-cena').textContent=d.precio;document.getElementById('p-popis').innerHTML=marked.parse(d.descripcion||'');const gal=document.getElementById('galerie');(d.galeria||[]).forEach(x=>{const i=document.createElement('img');i.src=x.imagen;i.alt=d.nombre;i.onclick=e=>{e.stopPropagation();openLightbox(x.imagen)};gal.appendChild(i)})}catch(e){document.getElementById('p-nazev').textContent='Přívěs se nepodařilo načíst.'}}document.addEventListener('DOMContentLoaded',nactiDetail);</script></body></html>
