<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Přívěs | Přívěsy z Nizozemska</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link id="theme-style" rel="stylesheet" href="assets/css/style-day.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    .product-page { max-width: 1100px; margin: 40px auto; padding: 20px; text-align: center; }
    .product-container {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }
    .left-col { max-width: 450px; width: 100%; }
    .product-image {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .product-image img {
      width: 100%;
      display: block;
      cursor: zoom-in;
    }
    .product-gallery {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      justify-items: center;
    }
    .product-gallery img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
    }
    .product-info {
      flex: 1;
      min-width: 300px;
      max-width: 500px;
      text-align: left;
    }
    .product-price {
      font-size: 26px;
      font-weight: bold;
      margin: 15px 0;
    }
    .product-description {
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .produkt-buttons {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }
    .produkt-btn, .produkt-info-btn {
      flex: 1;
      font-size: 18px;
      border: none;
      cursor: pointer;
      border-radius: 6px;
    }
    .categorias {
      margin-top: 60px;
      border-top: 1px solid #eee;
      padding-top: 30px;
      text-align: center;
    }
    .categorias .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      justify-content: center;
    }
    #lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      cursor: zoom-out;
      opacity: 0;
      transition: opacity 0.25s;
    }
    #lightbox.show { display: flex; opacity: 1; }
    #lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 5px;
    }
    .close-lightbox {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 50px;
      cursor: pointer;
      user-select: none;
    }
    @media (max-width: 768px) {
      .product-info { text-align: center; }
      .produkt-buttons { flex-direction: column; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="logo">
      <a href="index.html">
        <img src="logo.png" alt="Přívěsy z Nizozemska" style="height:90px;">
      </a>
    </div>
    <nav class="menu">
      <a href="privesy-na-kone.html">Přívěsy na koně</a>
      <a href="nakladni-privesy.html">Nákladní přívěsy</a>
      <a href="ostatni.html">Ostatní</a>
      <a href="contacto.html">Kontakt</a>
    </nav>
  </header>

  <main class="product-page">
    <div class="product-container">
      <div class="left-col">
        <div class="product-image">
          <img id="p-img" src="" alt="" onclick="openLightbox(this.src)">
        </div>
        <div id="galerie" class="product-gallery"></div>
      </div>

      <div class="product-info">
        <h1 id="p-nazev" class="produkt-nazev" style="font-size: 28px; margin:0;">Načítám...</h1>
        <div class="product-price" id="p-cena"></div>
        <div id="p-popis" class="product-description"></div>
        <div class="produkt-buttons">
          <button class="produkt-btn" style="height: 50px;" onclick="window.location.href='contacto.html'">KONTAKT</button>
          <button class="produkt-info-btn" style="height: 50px;" onclick="history.back()">ZPĚT</button>
        </div>
      </div>
    </div>

    <section class="categorias">
      <h2>Kategorie</h2>
      <p>Prohlédněte si další přívěsy v naší nabídce.</p>
      <div class="grid">
        <a class="card" href="privesy-na-kone.html">Přívěsy na koně</a>
        <a class="card" href="nakladni-privesy.html">Nákladní přívěsy</a>
        <a class="card" href="ostatni.html">Ostatní</a>
        <a class="card" href="contacto.html">Kontakt</a>
      </div>
    </section>
  </main>
<footer><p>© 2026 Přívěsy z Nizozemska | Import | Prodej | Výkup | <a href="/admin/">Administrace</a></p></footer>

  <div id="lightbox" onclick="closeLightbox()">
    <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");

    function openLightbox(src) {
      const lb = document.getElementById("lightbox");
      document.getElementById("lightbox-img").src = src;
      lb.style.display = "flex";
      setTimeout(() => lb.classList.add("show"), 10);
    }

    function closeLightbox() {
      const lb = document.getElementById("lightbox");
      lb.classList.remove("show");
      setTimeout(() => lb.style.display = "none", 250);
    }

    async function nactiDetail() {
      if (!slug) return;
      try {
        const resp = await fetch(`/data/productos/${slug}.json?t=${Date.now()}`);
        const data = await resp.json();

        document.getElementById("p-img").src = data.imagen;
        document.getElementById("p-nazev").textContent = data.nombre;
        document.getElementById("p-cena").textContent = data.precio;
        document.getElementById("p-popis").innerHTML = marked.parse(data.descripcion || "");

        const gal = document.getElementById("galerie");
        if (data.galeria) {
          data.galeria.forEach(item => {
            const img = document.createElement("img");
            img.src = item.imagen;
            img.onclick = (e) => {
              e.stopPropagation();
              openLightbox(item.imagen);
            };
            gal.appendChild(img);
          });
        }
      } catch (e) {}
    }

    document.addEventListener("DOMContentLoaded", nactiDetail);
  </script>
</body>
</html>
