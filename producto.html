<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Přívěs | Přívěsy z Nizozemska</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link id="theme-style" rel="stylesheet" href="assets/css/style-day.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    .product-page { max-width:1100px; margin:40px auto; padding:20px; text-align:center; }
    .product-container { display:flex; gap:40px; flex-wrap:wrap; justify-content:center; align-items:flex-start; }
    .left-col { max-width:450px; width:100%; }
    .product-image { width:100%; border-radius:10px; overflow:hidden; box-shadow:0 4px 15px rgba(0,0,0,.1); }
    .product-image img { width:100%; display:block; cursor:zoom-in; }
    .product-gallery { margin-top:15px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; justify-items:center; }
    .product-gallery img { width:100%; height:80px; object-fit:cover; border-radius:5px; cursor:pointer; transition:.2s; }
    .product-info { flex:1; min-width:300px; max-width:560px; text-align:left; }
    .product-price { font-size:26px; font-weight:bold; margin:15px 0; }
    .product-description { margin:0 0 25px; line-height:1.6; white-space:normal; }
    .product-description p:first-child { margin-top:0; }
    .product-specs { margin:20px 0 25px; border-top:1px solid #eee; border-bottom:1px solid #eee; }
    .spec-row { display:flex; justify-content:space-between; gap:20px; padding:10px 0; border-bottom:1px solid #eee; }
    .spec-row:last-child { border-bottom:0; }
    .spec-label { font-weight:700; }
    .spec-value { text-align:right; }
    .produkt-buttons { display:flex; gap:15px; margin-top:20px; }
    .produkt-btn, .produkt-info-btn { flex:1; font-size:18px; border:none; cursor:pointer; border-radius:6px; }
    .categorias { margin-top:60px; border-top:1px solid #eee; padding-top:30px; text-align:center; }
    .categorias .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:15px; justify-content:center; }
    #lightbox { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.92); display:none; justify-content:center; align-items:center; z-index:10000; cursor:zoom-out; opacity:0; transition:opacity .25s; }
    #lightbox.show { display:flex; opacity:1; }
    #lightbox img { max-width:90%; max-height:90%; border-radius:5px; }
    .close-lightbox { position:absolute; top:20px; right:30px; color:white; font-size:50px; cursor:pointer; user-select:none; }
    @media(max-width:768px) {
      .product-info { text-align:center; }
      .produkt-buttons { flex-direction:column; }
      .spec-row { text-align:left; }
      .spec-value { text-align:right; }
    }

    /* Galerie – rozměr hlavní fotografie určuje i šířku stínu a miniatur. */
    .product-page .left-col{width:100%;max-width:450px;}
    .product-page .product-image{width:100%;max-width:100%;overflow:hidden;line-height:0;background:transparent;box-shadow:none;border-radius:10px;}
    .product-page .product-image img{width:100%;height:auto;display:block;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,.16);}
    .product-page .product-gallery{width:100%;max-width:100%;margin:15px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start;}
    .product-page .product-gallery img{width:100%;height:82px;display:block;object-fit:cover;border-radius:7px;cursor:pointer;box-sizing:border-box;border:2px solid transparent;box-shadow:0 2px 7px rgba(0,0,0,.10);}
    .product-page .product-gallery img:hover{transform:none;}
    .product-page .product-gallery img.active{border-color:#1877F2;}
    #lightbox{position:fixed;inset:0;width:100%;height:100%;background:rgba(0,0,0,.94);display:none;justify-content:center;align-items:center;z-index:10000;cursor:default;opacity:0;transition:opacity .25s;}
    #lightbox.show{display:flex;opacity:1;}
    #lightbox .lightbox-stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:70px 80px 125px;box-sizing:border-box;}
    #lightbox-img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:5px;cursor:default;user-select:none;}
    .close-lightbox{position:absolute;top:12px;right:22px;color:white;font-size:48px;line-height:1;cursor:pointer;user-select:none;z-index:3;}
    .lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#1877F2;font-size:28px;font-weight:700;cursor:pointer;z-index:3;box-shadow:0 4px 12px rgba(0,0,0,.25);}
    .lightbox-prev{left:18px}.lightbox-next{right:18px}
    .lightbox-strip{position:absolute;left:70px;right:70px;bottom:18px;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:5px 4px 10px;box-sizing:border-box;scroll-behavior:smooth;scrollbar-width:auto;}
    .lightbox-strip::-webkit-scrollbar{height:9px}.lightbox-strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.65);border-radius:8px;}
    .lightbox-thumb{flex:0 0 78px;width:78px;height:58px;object-fit:cover;border-radius:5px;border:2px solid transparent;opacity:.7;cursor:pointer;box-sizing:border-box;}
    .lightbox-thumb.active{border-color:#fff;opacity:1;}
    @media(max-width:768px){
      .product-page .left-col{max-width:100%;}
      .product-page .product-gallery{gap:7px;}
      .product-page .product-gallery img{height:auto;aspect-ratio:1.35/1;}
      #lightbox .lightbox-stage{padding:55px 12px 120px;}
      .lightbox-nav{width:42px;height:42px;font-size:24px}.lightbox-prev{left:8px}.lightbox-next{right:8px}
      .lightbox-strip{left:10px;right:10px;bottom:10px}.lightbox-thumb{flex-basis:70px;width:70px;height:52px;}
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="logo">
      <a href="index.html">
        <img src="logo.png" alt="Přívěsy z Nizozemska" style="height:90px;">
      </a>
    </div>
    <nav class="menu">
      <a href="privesy-na-kone.html">Přívěsy na koně</a>
      <a href="nakladni-privesy.html">Nákladní přívěsy</a>
      <a href="ostatni.html">Ostatní</a>
      <a href="contacto.html">Kontakt</a>
    </nav>
  </header>

  <main class="product-page">
    <div class="product-container">
      <div class="left-col">
        <div class="product-image">
          <img id="p-img" src="" alt="" >
        </div>
        <div id="galerie" class="product-gallery"></div>
      </div>

      <div class="product-info">
        <h1 id="p-nazev" class="produkt-nazev" style="font-size:28px;margin:0;">Načítám...</h1>
        <div class="product-price" id="p-cena"></div>

        <div id="p-specs" class="product-specs"></div>

        <h2 id="popis-heading" style="margin-bottom:10px;">Popis</h2>
        <div id="p-popis" class="product-description"></div>

        <div class="produkt-buttons">
          <button class="produkt-btn" style="height:50px;" onclick="window.location.href='contacto.html'">KONTAKT</button>
          <button class="produkt-info-btn" style="height:50px;" onclick="history.back()">ZPĚT</button>
        </div>
      </div>
    </div>

    <section class="categorias">
      <h2>Kategorie</h2>
      <p>Prohlédněte si další přívěsy v naší nabídce.</p>
      <div class="grid">
        <a class="card" href="privesy-na-kone.html">Přívěsy na koně</a>
        <a class="card" href="nakladni-privesy.html">Nákladní přívěsy</a>
        <a class="card" href="ostatni.html">Ostatní</a>
        <a class="card" href="contacto.html">Kontakt</a>
      </div>
    </section>
  </main>

  <div id="lightbox" aria-hidden="true">
    <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
    <button class="lightbox-nav lightbox-prev" type="button" onclick="changeLightbox(-1)" aria-label="Předchozí fotografie">&#10094;</button>
    <div class="lightbox-stage">
      <img id="lightbox-img" src="" alt="">
    </div>
    <button class="lightbox-nav lightbox-next" type="button" onclick="changeLightbox(1)" aria-label="Další fotografie">&#10095;</button>
    <div id="lightbox-strip" class="lightbox-strip" aria-label="Fotografie"></div>
  </div>

  <footer>
    <p>© 2026 Přívěsy z Nizozemska | Import | Prodej | Výkup</p>
    <p style="margin-top:8px;"><a href="/admin/" style="opacity:.75;">Admin</a></p>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");

    let lightboxImages = [];
    let lightboxIndex = 0;

    function buildLightboxImages(data) {
      lightboxImages = [];
      if (data.imagen) lightboxImages.push({src:data.imagen, alt:data.nombre || ""});
      if (Array.isArray(data.galeria)) {
        data.galeria.forEach(item => {
          if (item && item.imagen) lightboxImages.push({src:item.imagen, alt:data.nombre || ""});
        });
      }
    }

    function openLightbox(index) {
      if (!lightboxImages.length) return;
      lightboxIndex = Math.max(0, Math.min(index, lightboxImages.length - 1));
      const lb = document.getElementById("lightbox");
      lb.style.display = "flex";
      lb.setAttribute("aria-hidden", "false");
      renderLightbox();
      setTimeout(() => lb.classList.add("show"), 10);
    }

    function renderLightbox() {
      const current = lightboxImages[lightboxIndex];
      if (!current) return;
      const image = document.getElementById("lightbox-img");
      image.src = current.src;
      image.alt = current.alt || "";
      const strip = document.getElementById("lightbox-strip");
      strip.innerHTML = "";
      lightboxImages.forEach((item, i) => {
        const thumb = document.createElement("img");
        thumb.className = "lightbox-thumb" + (i === lightboxIndex ? " active" : "");
        thumb.src = item.src;
        thumb.alt = item.alt || "";
        thumb.onclick = e => { e.stopPropagation(); lightboxIndex = i; renderLightbox(); };
        strip.appendChild(thumb);
      });
      const active = strip.children[lightboxIndex];
      if (active) active.scrollIntoView({behavior:"smooth", block:"nearest", inline:"center"});
    }

    function changeLightbox(direction) {
      if (!lightboxImages.length) return;
      lightboxIndex = (lightboxIndex + direction + lightboxImages.length) % lightboxImages.length;
      renderLightbox();
    }

    function closeLightbox() {
      const lb = document.getElementById("lightbox");
      lb.classList.remove("show");
      lb.setAttribute("aria-hidden", "true");
      setTimeout(() => lb.style.display = "none", 250);
    }

    document.addEventListener("keydown", e => {
      const lb = document.getElementById("lightbox");
      if (!lb.classList.contains("show")) return;
      if (e.key === "ArrowLeft") changeLightbox(-1);
      else if (e.key === "ArrowRight") changeLightbox(1);
      else if (e.key === "Escape") closeLightbox();
    });

    document.addEventListener("DOMContentLoaded", () => {
      const lb = document.getElementById("lightbox");
      if (lb) lb.addEventListener("click", e => {
        if (e.target === lb) closeLightbox();
      });
    });

    function addSpec(label, value) {
      if (value === null || value === undefined || String(value).trim() === "") return;
      const row = document.createElement("div");
      row.className = "spec-row";
      row.innerHTML = `<span class="spec-label"></span><span class="spec-value"></span>`;
      row.querySelector(".spec-label").textContent = label;
      row.querySelector(".spec-value").textContent = value;
      document.getElementById("p-specs").appendChild(row);
    }

    function formatKg(value, absolute = false) {
      if (value === null || value === undefined || value === "") return "";
      const n = Number(String(value).replace(/\s/g, ""));
      if (!Number.isFinite(n)) return `${value} kg`;
      const shown = absolute ? Math.abs(n) : n;
      return `${shown.toLocaleString("cs-CZ")} kg`;
    }

    async function nactiDetail() {
      if (!slug) return;
      try {
        const resp = await fetch(`/data/productos/${slug}.json?t=${Date.now()}`);
        if (!resp.ok) throw new Error("Produkt nebyl nalezen.");
        const data = await resp.json();

        document.getElementById("p-img").src = data.imagen || "";
        document.getElementById("p-img").alt = data.nombre || "";
        document.getElementById("p-nazev").textContent = data.nombre || "";
        document.getElementById("p-cena").textContent = data.precio || "";

        const specs = document.getElementById("p-specs");
        specs.innerHTML = "";

        addSpec("Kategorie", data.categoria === "prepravniky" ? "Přívěsy na koně" :
          data.categoria === "nakladni-privesy" ? "Nákladní přívěsy" : "Ostatní");
        addSpec("Výrobce", data.vyrobce);
        addSpec("Rok výroby", data.rokVyroby);
        addSpec("Provozní hmotnost", formatKg(data.provozniHmotnostKg));
        addSpec("Celková hmotnost", formatKg(data.celkovaHmotnostKg));
        addSpec("Užitečná hmotnost / nosnost", formatKg(data.uzitecnaHmotnostKg, true));
        addSpec("STK", data.stk);

        const popis = document.getElementById("p-popis");
        const description = String(data.descripcion || "").trim();
        if (description) {
          try {
            popis.innerHTML = (window.marked && typeof marked.parse === "function")
              ? marked.parse(description)
              : description.replace(/\n/g, "<br>");
        } catch {
          popis.textContent = description;
        }
        } else {
          popis.innerHTML = "<span style='color:#777;'>Popis není uveden.</span>";
        }

        buildLightboxImages(data);
        const gal = document.getElementById("galerie");
        gal.innerHTML = "";
        if (Array.isArray(data.galeria)) {
          data.galeria.forEach((item, i) => {
            if (!item || !item.imagen) return;
            const img = document.createElement("img");
            img.src = item.imagen;
            img.alt = data.nombre || "";
            img.onclick = e => {
              e.stopPropagation();
              openLightbox(i + 1);
            };
            gal.appendChild(img);
          });
        }
        document.getElementById("p-img").onclick = () => openLightbox(0);
      } catch (e) {
        document.getElementById("p-nazev").textContent = "Přívěs se nepodařilo načíst.";
        document.getElementById("p-popis").textContent = e.message || "";
      }
    }

    document.addEventListener("DOMContentLoaded", nactiDetail);
  </script>
</body>
</html>
